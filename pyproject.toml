[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wgan-gp"
version = "0.1.0"
description = "Latent-vector WGAN-GP adapted from the existing fork"
requires-python = ">=3.12,<3.13"
dependencies = ["torch>=2.14,<2.15"]

[tool.setuptools.packages.find]
include = ["wgan_gp*"]
